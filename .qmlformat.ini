[General]
IndentWidth=4
UseTabs=false
MaxColumnWidth=100
NewlineType=unix
SemicolonRule=always
; Leave property/attribute order as written -- Main.qml relies on a
; readable id-first, required-properties-next ordering in delegates that
; NormalizeOrder/GroupAttributesTogether would alphabetize away.
NormalizeOrder=false
GroupAttributesTogether=false
SortImports=false
ObjectsSpacing=false
FunctionsSpacing=false
SingleLineEmptyObjects=false
